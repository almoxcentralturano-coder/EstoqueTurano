<title>Painel do Galpão</title>

<!-- Tailwind CSS (CDN) e ícones Lucide (CDN), com versão fixa -->
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'Segoe UI', 'Roboto', 'Arial', 'sans-serif'] },
        // Azul da logo da Turano (#002060) = brand-800. Para mudar a cor principal, ajuste esta escala.
        colors: {
          brand: { 50: '#eef3fb', 100: '#dce6f6', 200: '#b9cdec', 300: '#8eaadb', 400: '#5b80c4', 500: '#2f58a6', 600: '#14408a', 700: '#06306f', 800: '#002060', 900: '#001540' }
        }
      }
    }
  };
</script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  @media print {
    aside, .rel-controles, .rel-acoes, .modal, #toast, #kpis, #titulo-aba, #sub-aba { display: none !important; }
    body { background: #fff; }
    #painel { display: block !important; }
    main { max-width: none !important; padding: 0 !important; }
  }
</style>
<style type="text/tailwindcss">
  @layer base {
    body { @apply bg-slate-50 font-sans text-slate-800 antialiased; }
    label { @apply mb-1.5 mt-3 block text-sm font-medium text-slate-700; }
    /* :where() mantém a especificidade baixa, para que classes como pl-11 ou text-center vençam este estilo-base */
    input:where(:not([type=checkbox]):not([type=radio])), select, textarea {
      @apply w-full rounded-xl border border-slate-300 bg-white px-3.5 py-2.5 text-sm text-slate-800 shadow-sm transition-all duration-200 placeholder:text-slate-400 focus:border-brand-500 focus:outline-none focus:ring-4 focus:ring-brand-500/15 disabled:bg-slate-100 disabled:text-slate-400;
    }
    button { @apply cursor-pointer; }
    button:focus-visible, summary:focus-visible { @apply outline-none ring-4 ring-brand-500/30; }
  }
  @layer components {
    h2 { @apply text-xl font-semibold tracking-tight text-slate-900; }
    h3 { @apply text-base font-semibold text-slate-900; }
    .muted { @apply text-slate-500; }
    .erro { @apply mt-2 text-sm font-medium text-rose-600 empty:hidden; }
    .nota { @apply mb-3 mt-1 text-xs leading-relaxed text-slate-500; }

    /* botões */
    .prim { @apply inline-flex items-center justify-center gap-2 rounded-xl bg-brand-800 px-4 py-2.5 text-sm font-semibold text-white shadow-sm transition-all duration-200 hover:bg-brand-700 hover:shadow-md active:scale-[.98] disabled:cursor-not-allowed disabled:bg-slate-300 disabled:shadow-none disabled:active:scale-100; }
    .sec { @apply inline-flex items-center justify-center gap-2 rounded-xl border border-slate-300 bg-white px-4 py-2.5 text-sm font-semibold text-slate-700 shadow-sm transition-all duration-200 hover:border-brand-400 hover:bg-brand-50 hover:text-brand-800 active:scale-[.98] disabled:cursor-not-allowed disabled:opacity-50 disabled:hover:border-slate-300 disabled:hover:bg-white disabled:hover:text-slate-700 disabled:active:scale-100; }
    .sec.perigo { @apply border-rose-200 text-rose-600 hover:border-rose-400 hover:bg-rose-50 hover:text-rose-700 disabled:hover:border-rose-200 disabled:hover:bg-white disabled:hover:text-rose-600; }
    .bar-btn { @apply inline-flex items-center justify-center gap-2 rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm font-medium text-slate-600 transition-all duration-200 hover:border-brand-300 hover:bg-brand-50 hover:text-brand-800 active:scale-95; }

    /* navegação */
    .tab { @apply flex flex-none items-center gap-2.5 whitespace-nowrap rounded-lg px-3 py-2 text-sm font-medium text-slate-500 transition-all duration-200 hover:bg-slate-100 hover:text-slate-900 active:scale-[.98] lg:w-full lg:py-2.5; }
    .tab[aria-selected="true"] { @apply bg-brand-50 text-brand-800; }
    .tab[aria-selected="true"] svg { @apply text-brand-700; }
    .badge { @apply ml-auto inline-flex min-w-[1.4rem] items-center justify-center rounded-full bg-brand-800 px-1.5 py-0.5 text-xs font-semibold leading-none text-white; }
    .badge.zero { @apply bg-slate-200 text-slate-500; }
    .kpi { @apply flex items-center gap-3 rounded-xl border border-slate-200 bg-white p-4 shadow-sm transition-all duration-200 hover:shadow-md; }
    .kpi-ic { @apply flex h-10 w-10 flex-none items-center justify-center rounded-lg; }

    /* pedidos */
    .pedido { @apply mb-4 rounded-xl border border-l-4 border-slate-200 border-l-brand-600 bg-white p-4 shadow-sm transition-all duration-200 hover:shadow-md sm:p-5; }
    .pedido.entrada { @apply border-l-emerald-500; }
    .topo { @apply mb-1 flex flex-wrap items-center gap-2; }
    .tipo { @apply inline-flex items-center gap-1 rounded-md bg-brand-600 px-2 py-0.5 text-xs font-semibold text-white; }
    .tipo.ent, .entrada .tipo { @apply bg-emerald-600; }
    .tipo.ajuste { @apply bg-amber-600; }
    .pid { @apply text-lg font-semibold tracking-tight text-slate-900; }
    .chip { @apply inline-flex items-center rounded-full bg-brand-50 px-2.5 py-0.5 text-xs font-medium text-brand-700; }
    .chip.atraso { @apply bg-rose-50 text-rose-700; }
    .chip.hoje { @apply bg-amber-50 text-amber-700; }
    .chip.ok { @apply bg-emerald-50 text-emerald-700; }
    .chip.rec, .chip.off { @apply bg-slate-100 text-slate-600; }
    .meta { @apply my-3 grid grid-cols-2 gap-x-6 gap-y-3 sm:grid-cols-3 xl:grid-cols-5; }
    .meta span { @apply block text-xs text-slate-500; }
    .meta b { @apply break-words text-sm font-semibold text-slate-800; }
    .obs { @apply my-3 rounded-lg border border-slate-200 bg-slate-50 px-3 py-2 text-sm text-slate-700; }
    .il { @apply grid grid-cols-3 items-center gap-x-3 gap-y-1 border-t border-slate-100 py-3 sm:grid-cols-[minmax(0,1fr)_5.5rem_5.5rem_7.5rem]; }
    .il.cab { @apply hidden border-t-0 py-1 text-[11px] font-semibold uppercase tracking-wide text-slate-400 sm:grid; }
    .il .nome { @apply col-span-3 break-words text-sm font-medium text-slate-900 sm:col-span-1; }
    .il .c { @apply text-sm text-slate-700 sm:text-right; }
    .il.cab .c { @apply text-[11px] text-slate-400; }
    .il .c::before { @apply mb-0.5 block text-[11px] font-medium text-slate-400 sm:hidden; content: attr(data-l); }
    .il input { @apply px-3 py-2 text-left font-semibold sm:text-right; }
    .il .alerta { @apply col-span-full text-xs font-medium text-rose-600; }
    .il .alerta.aviso { @apply text-amber-700; }
    .acoes { @apply mt-4 flex flex-wrap items-end gap-3; }
    .acoes .campo { @apply min-w-[9rem] flex-1 basis-40; }
    .acoes .campo label { @apply mt-0; }
    .vazio { @apply rounded-xl border border-dashed border-slate-300 bg-white px-4 py-12 text-center text-sm text-slate-500; }
    .vazio.erro { @apply text-rose-600; }

    /* estoque */
    .barra { @apply mb-3 grid grid-cols-2 items-center gap-2 sm:grid-cols-[2fr_1.4fr_1.4fr_auto]; }
    .barra > input { @apply col-span-2 sm:col-span-1; }
    .mat { @apply mb-2.5 rounded-xl border border-slate-200 bg-white p-4 shadow-sm transition-all duration-200 hover:shadow-md; }
    .mat.oculto { @apply opacity-60; }
    .mat .l1 { @apply grid gap-3 md:grid-cols-[minmax(0,1fr)_auto] md:items-center; }
    .mat .nome { @apply break-words text-sm font-medium text-slate-900; }
    .mat .cat { @apply mt-0.5 text-xs text-slate-500; }
    .nums { @apply grid grid-cols-4 gap-3 text-left md:w-[22rem] md:text-right; }
    .nums div span { @apply block text-[11px] text-slate-400; }
    .nums div b { @apply text-base font-semibold text-slate-900; }
    .nums .neg b { @apply text-rose-600; }
    .mat .acoes { @apply mt-3; }
    .mat .acoes button { @apply px-3 py-1.5 text-xs; }
    .mat .ajuste { @apply mt-3 rounded-xl border border-slate-200 bg-slate-50 p-3.5; }
    .novo { @apply mb-4 rounded-xl border border-brand-200 bg-white p-4 shadow-sm; }
    .grade2 { @apply grid gap-x-3 sm:grid-cols-2 lg:grid-cols-3; }

    /* histórico */
    .filtros { @apply mb-4 rounded-xl border border-slate-200 bg-white p-4 shadow-sm; }
    .filtros .grade { @apply grid grid-cols-2 gap-x-3 sm:grid-cols-3 xl:grid-cols-5; }
    .filtros label { @apply mt-2; }
    .filtros .linha { @apply mt-3 flex flex-wrap items-center gap-3; }
    .filtros .linha .nota { @apply m-0 flex-1 basis-56; }
    details.hist { @apply mb-2.5 rounded-xl border border-slate-200 bg-white shadow-sm transition-all duration-200 open:shadow-md; }
    details.hist summary { @apply flex cursor-pointer list-none flex-wrap items-center gap-x-3 gap-y-1.5 rounded-xl px-4 py-3 text-sm transition-all duration-200 hover:bg-slate-50; }
    details.hist summary::-webkit-details-marker { display: none; }
    details.hist .corpo { @apply px-4 pb-4; }
    .aj { @apply mb-2.5 rounded-xl border border-l-4 border-slate-200 border-l-amber-500 bg-white p-4 shadow-sm; }
    .aj .mov { @apply my-1.5 text-lg font-bold tracking-tight text-slate-900; }
    .aj .mov.neg { @apply text-rose-600; }
    .aj .quem2 { @apply mt-1.5 text-xs text-slate-500; }

    /* relatórios */
    .rel-controles { @apply rounded-xl border border-slate-200 bg-white p-4 shadow-sm; }
    .rel-controles .grade { @apply grid grid-cols-1 gap-x-3 sm:grid-cols-2 xl:grid-cols-4; }
    .rel-controles label { @apply mt-2; }
    .rel-papel { @apply mt-4 rounded-xl border border-slate-200 bg-white p-5 shadow-sm; }
    .rel-papel h2 { @apply mb-1; }
    .atrasado { @apply font-semibold text-rose-600; }
    .pendente { @apply font-medium text-amber-600; }
    .rel-papel h3 { @apply mt-6 border-b-2 border-brand-700 pb-1 text-base font-semibold text-brand-800; }
    .rel-totais { @apply my-3 rounded-lg border border-slate-200 bg-slate-50 px-3 py-2 text-sm; }
    .tabela-wrap { @apply mt-2 overflow-x-auto; }
    table.rel { @apply w-full min-w-[600px] border-collapse text-sm; }
    table.rel th { @apply whitespace-nowrap border-b-2 border-brand-800 bg-brand-50 px-2.5 py-2 text-left text-xs font-semibold text-brand-800; }
    table.rel td { @apply border-b border-slate-100 px-2.5 py-2 align-top; }
    table.rel td.n { @apply whitespace-nowrap font-semibold; }
    .rel-acoes { @apply mt-4 flex flex-wrap gap-3; }

    /* administradores */
    .adm { @apply mb-2.5 flex flex-wrap items-center gap-x-3 gap-y-2 rounded-xl border border-slate-200 bg-white p-4 shadow-sm; }
    .adm .nome { @apply min-w-[8rem] flex-1 text-base font-semibold text-slate-900; }
    .adm .acoes { @apply m-0; }
    .adm .acoes button { @apply px-3 py-1.5 text-xs; }
    .troca { @apply basis-full rounded-xl border border-slate-200 bg-slate-50 p-3.5; }
    .mostrar { @apply mt-1.5 flex items-center gap-2 text-xs font-normal text-slate-500; }
    .mostrar input { @apply h-4 w-4 rounded border-slate-300 text-brand-800; }

    /* janela de confirmação e aviso */
    .modal { @apply fixed inset-0 z-40 flex items-center justify-center bg-slate-900/50 p-4 backdrop-blur-sm; }
    .modal .caixa { @apply w-full max-w-md rounded-2xl bg-white p-6 shadow-xl; }
    .modal h3 { @apply text-lg font-semibold text-slate-900; }
    .modal p { @apply mb-3 mt-1 whitespace-pre-line text-sm text-slate-500; }
    .modal .botoes { @apply mt-5 flex flex-wrap justify-end gap-3; }
    /* nota fiscal e anexos */
    .nf { @apply mt-4 rounded-xl border border-emerald-200 bg-emerald-50/50 p-3 sm:p-4; }
    .nf-cab { @apply flex flex-wrap items-center gap-2 text-sm font-semibold text-slate-800; }
    .nf-num { @apply mt-2 flex flex-wrap items-end gap-2; }
    .nf-num .campo { @apply min-w-[10rem] flex-1; }
    .nf-num label { @apply mt-0; }
    .nf-arqs { @apply mt-3 grid grid-cols-3 gap-2 sm:grid-cols-5 lg:grid-cols-6; }
    .arq { @apply relative overflow-hidden rounded-lg border border-slate-200 bg-white shadow-sm; }
    .arq .mini { @apply flex aspect-square w-full items-center justify-center overflow-hidden bg-slate-100 text-slate-400 transition-all duration-200 hover:opacity-90; }
    .arq .mini img { @apply h-full w-full object-cover; }
    .arq .rot { @apply truncate px-1.5 py-1 text-[10px] text-slate-500; }
    .arq .tirar { @apply absolute right-1 top-1 flex h-7 w-7 items-center justify-center rounded-full bg-white/90 text-slate-600 shadow ring-1 ring-slate-200 transition-all duration-200 hover:bg-rose-600 hover:text-white; }
    .nf-acoes { @apply mt-3 flex flex-wrap gap-2; }
    .nf-acoes label.botao { @apply m-0 inline-flex cursor-pointer items-center gap-2 rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm font-semibold text-slate-700 shadow-sm transition-all duration-200 hover:border-brand-400 hover:text-brand-800; }
    .nf-acoes input[type=file] { @apply sr-only; }
    .nf .estado { @apply mt-2 text-xs font-medium text-slate-600 empty:hidden; }
    .visor { @apply fixed inset-0 z-50 flex flex-col bg-slate-950/95; }
    .visor-cab { @apply flex items-center gap-1 px-3 py-2 text-white; }
    .visor-btn { @apply flex h-10 w-10 flex-none cursor-pointer items-center justify-center rounded-lg text-white/90 transition-all duration-200 hover:bg-white/10 disabled:opacity-30; }
    .visor-corpo { @apply flex min-h-0 flex-1 items-center justify-center p-2 sm:p-4; }
    .visor-corpo img { @apply max-h-full max-w-full rounded-lg object-contain shadow-2xl; }
    .visor-corpo iframe { @apply h-full w-full rounded-lg bg-white; }
    .visor-corpo .aviso-v { @apply max-w-sm rounded-xl bg-white p-6 text-center text-sm text-slate-600; }
    /* cadastros */
    .cad-sec { @apply mb-8; }
    .cad-sec h2 { @apply mb-1 flex items-center gap-2 text-lg font-semibold text-slate-900; }
    .cnpj { @apply font-mono text-xs text-slate-500; }
    #toast { @apply fixed bottom-6 left-1/2 z-50 max-w-[92vw] -translate-x-1/2 rounded-xl bg-slate-900 px-4 py-3 text-sm font-medium text-white shadow-lg; }
    #toast.erro-t { @apply bg-rose-600; }
  }
</style>
</head>

  /** Lê o arquivo escolhido. Foto grande é reduzida (lado maior de 2000 px, JPEG) para enviar rápido pelo celular. */
  function prepararArquivo(file) {

    if (u.criadoPor || u.criadoEm) card.appendChild(el('div', { cls: 'nota', txt: 'Cadastrado' + (u.criadoPor ? ' por ' + u.criadoPor : '') + (u.criadoEm ? ' em ' + fmtDT(u.criadoEm) : ''), style: 'flex:1 1 100%;margin:0' }));
    var troca = formTrocaSenha('p-' + u.usuario, false, function (atual, nova) { return chamar('adminTrocarSenhaUsuario', S.cod, u.usuario, nova); }, 'Senha de ' + u.nome + ' alterada.');
    var bTroca = el('button', { cls: 'sec', type: 'button', txt: 'Trocar senha', onclick: function () { troca.hidden = !troca.hidden; if (!troca.hidden) troca.querySelector('input').focus(); } });
    var bAtivo = el('button', { cls: 'sec' + (u.ativo ? ' perigo' : ''), type: 'button', txt: u.ativo ? 'Desativar' : 'Reativar', onclick: function () {
      confirmar({ titulo: (u.ativo ? 'Desativar ' : 'Reativar ') + u.nome + '?', texto: u.ativo ? 'A pessoa deixa de conseguir entrar e pedir material. Os pedidos dela continuam guardados.' : 'A pessoa volta a conseguir entrar.', ok: u.ativo ? 'Desativar' : 'Reativar' }).then(function (r) {
        if (!r.ok) return;
        chamar('adminSetUsuarioAtivo', S.cod, u.usuario, !u.ativo).then(function () { aviso(u.ativo ? u.nome + ' desativado.' : u.nome + ' reativado.'); S.eq = null; carregarEquipe(); })
          .catch(function (e) { aviso(msg(e), true); });
      });
    } });
    card.appendChild(el('div', { cls: 'acoes' }, bTroca, bAtivo));
    card.appendChild(troca);
    return card;
  }

  // ---------- registro de acessos ----------
  var seqA = 0, timerA = null;
  var RESULTADOS = ['Entrou', 'Falha', 'Bloqueado', 'Senha alterada', 'Senha redefinida'];
  function carregarAcessos() {
    var box = $('aba-ac');
    if (!$('ac-lista')) {
      box.innerHTML = '';
      var f = S.fa;
      var perfil = el('select', { id: 'ac-perfil', 'aria-label': 'Tipo de acesso' }, opcao('', 'Obra e administradores'), opcao('Obra', 'Só a obra'), opcao('Administrador', 'Só administradores'));
      var res = el('select', { id: 'ac-res', 'aria-label': 'Resultado' }, opcao('', 'Todos os resultados')); RESULTADOS.forEach(function (r) { res.appendChild(opcao(r, r)); });
      var q = el('input', { type: 'search', id: 'ac-q', placeholder: 'Buscar usuário ou nome', 'aria-label': 'Buscar usuário ou nome' });
      perfil.value = f.perfil; res.value = f.resultado; q.value = f.q;
      var vai = function () { f.perfil = perfil.value; f.resultado = res.value; f.q = q.value; buscar(); };
      perfil.addEventListener('change', vai); res.addEventListener('change', vai);
      q.addEventListener('input', function () { clearTimeout(timerA); timerA = setTimeout(vai, 250); });
      box.appendChild(el('div', { cls: 'barra' }, perfil, res, q));
      box.appendChild(el('div', { cls: 'nota', id: 'ac-info' }));
      box.appendChild(el('div', { id: 'ac-lista' }));
    }
    buscar();
  }
  function buscar() {
    var meu = ++seqA, lista = $('ac-lista');
    chamar('adminAcessos', S.cod, S.fa).then(function (r) {
      if (meu !== seqA) return;
      S.ac = r; lista.innerHTML = '';
      $('ac-info').textContent = r.total + ' registro(s)' + (r.total > r.itens.length ? '; mostrando os ' + r.itens.length + ' mais recentes' : '') + '. Falhas seguidas bloqueiam o usuário por 10 minutos.';
      if (!r.itens.length) { lista.appendChild(el('div', { cls: 'vazio', txt: 'Nenhum registro com esses filtros.' })); return; }
      var tr = el('tr'); ['Quando', 'Tipo', 'Usuário', 'Nome', 'Resultado', 'Detalhe'].forEach(function (c) { tr.appendChild(el('th', { txt: c })); });
      var tb = el('tbody');
      r.itens.forEach(function (a) {
        var cls = a.resultado === 'Entrou' ? 'chip ok' : (a.resultado === 'Falha' || a.resultado === 'Bloqueado' ? 'chip off' : 'chip');
        tb.appendChild(el('tr', null, el('td', { cls: 'n', txt: fmtDT(a.quando) }), el('td', { txt: a.perfil }), el('td', { txt: a.usuario }), el('td', { txt: a.nome || '—' }),
          el('td', null, el('span', { cls: cls, txt: a.resultado })), el('td', { txt: a.detalhe })));
      });
      lista.appendChild(el('div', { cls: 'tabela-wrap' }, el('table', { cls: 'rel', style: 'min-width:0' }, el('thead', null, tr), tb)));
    }).catch(function (e) { if (meu !== seqA) return; lista.innerHTML = ''; lista.appendChild(el('div', { cls: 'vazio erro', txt: msg(e) })); });
  }

  // ---------- estoque ----------
  function carregarEstoque() {
    var box = $('aba-est');
    if (S.est && !S.estSujo) { desenharEstoque(); return; }
    box.innerHTML = ''; box.appendChild(el('div', { cls: 'vazio', txt: 'Carregando estoque...' }));
    chamar('adminEstoque', S.cod).then(function (lista) { S.est = lista; S.estSujo = false; desenharEstoque(); })
      .catch(function (e) { box.innerHTML = ''; box.appendChild(el('div', { cls: 'vazio erro', txt: msg(e) })); });
  }
  function desenharEstoque() {
    var box = $('aba-est'); box.innerHTML = '';
    var f = S.filtroEst;
    var cats = {}; S.est.forEach(function (m) { cats[m.c] = 1; });
    var busca = el('input', { type: 'search', placeholder: 'Buscar material', 'aria-label': 'Buscar material', value: f.q });
    var cat = el('select', { 'aria-label': 'Categoria' }, el('option', { value: '', txt: 'Todas as categorias' }));
    Object.keys(cats).forEach(function (c) { var o = el('option', { value: c, txt: c }); if (c === f.cat) o.selected = true; cat.appendChild(o); });
    var modo = el('select', { 'aria-label': 'Filtro' });
    [['ativos', 'Materiais ativos'], ['saldo', 'Com saldo'], ['zerados', 'Sem saldo'], ['mov', 'Com reserva ou em trânsito'], ['ocultos', 'Ocultos']].forEach(function (p) {
      var o = el('option', { value: p[0], txt: p[1] }); if (p[0] === f.modo) o.selected = true; modo.appendChild(o);
    });
    var novo = el('button', { cls: 'sec', type: 'button', txt: '+ Novo material', onclick: function () { formNovo.hidden = !formNovo.hidden; if (!formNovo.hidden) formNovo.querySelector('input').focus(); } });
    box.appendChild(el('div', { cls: 'barra' }, busca, cat, modo, novo));
    var formNovo = formularioNovo(Object.keys(cats)); formNovo.hidden = true; box.appendChild(formNovo);
    var info = el('div', { cls: 'nota' }); box.appendChild(info);
    var lista = el('div'); box.appendChild(lista);
    var mais = el('button', { cls: 'sec', type: 'button', txt: 'Mostrar mais', style: 'width:100%' }); box.appendChild(mais);

    function pinta() {
      var termos = semAcento(f.q).split(/\s+/).filter(Boolean);
      var vis = S.est.filter(function (m) {
        if (f.modo === 'ocultos' ? m.ativo : !m.ativo) return false;
        if (f.cat && m.c !== f.cat) return false;
        if (f.modo === 'saldo' && !(m.f > 0)) return false;
        if (f.modo === 'zerados' && m.f !== 0) return false;
        if (f.modo === 'mov' && !(m.r > 0 || m.e > 0)) return false;
        var k = semAcento(m.n + ' ' + m.c);
        for (var i = 0; i < termos.length; i++) if (k.indexOf(termos[i]) < 0) return false;
        return true;
      });
      lista.innerHTML = '';
      vis.slice(0, f.limite).forEach(function (m) { lista.appendChild(linhaEstoque(m)); });
      if (!vis.length) lista.appendChild(el('div', { cls: 'vazio', txt: 'Nenhum material encontrado.' }));
      info.textContent = vis.length + ' material(is). "Disponível" = no galpão − a retirar.';
      mais.hidden = vis.length <= f.limite;
    }
    var t = null;
    busca.addEventListener('input', function () { clearTimeout(t); t = setTimeout(function () { f.q = busca.value; f.limite = 60; pinta(); }, 180); });
    cat.addEventListener('change', function () { f.cat = cat.value; f.limite = 60; pinta(); });
    modo.addEventListener('change', function () { f.modo = modo.value; f.limite = 60; pinta(); });
    mais.addEventListener('click', function () { f.limite += 60; pinta(); });
    pinta();
  }
  function num(rot, v, neg) { return el('div', { cls: neg ? 'neg' : '' }, el('span', { txt: rot }), el('b', { txt: String(v) })); }
  function linhaEstoque(m) {
    var card = el('div', { cls: 'mat' + (m.ativo ? '' : ' oculto') });
    card.appendChild(el('div', { cls: 'l1' },
      el('div', null, el('div', { cls: 'nome', txt: m.n }), el('div', { cls: 'cat', txt: m.c + ' · ' + m.u + ' · ' + m.id })),
      el('div', { cls: 'nums' }, num('No galpão', m.f, m.f < 0), num('A retirar', m.r), num('A entrar', m.e), num('Disponível', m.d, m.d < 0))));
    var area = el('div'); area.hidden = true;
    var ajustar = el('button', { cls: 'sec', type: 'button', txt: 'Ajustar saldo', onclick: function () { area.hidden = !area.hidden; if (!area.hidden) area.querySelector('input').focus(); } });
    var ocultar = el('button', { cls: 'sec', type: 'button', txt: m.ativo ? 'Ocultar' : 'Reativar', onclick: function () {
      chamar('adminAtivar', S.cod, m.id, !m.ativo).then(function () { m.ativo = !m.ativo; desenharEstoque(); aviso(m.ativo ? 'Material reativado.' : 'Material oculto dos pedidos.'); })
        .catch(function (e) { aviso(msg(e), true); });
    } });
    card.appendChild(el('div', { cls: 'acoes' }, ajustar, ocultar));
    var cont = el('input', { type: 'number', min: '0', step: '1', inputmode: 'numeric', 'aria-label': 'Contagem real de ' + m.n, value: String(m.f) });
    var motivo = el('input', { type: 'text', maxlength: '200', placeholder: 'Ex.: contagem física, material danificado', 'aria-label': 'Motivo do ajuste (obrigatório)', required: 'required' });
    var erro = el('div', { cls: 'erro', role: 'alert' });
    var salvar = el('button', { cls: 'prim', type: 'button', txt: 'Salvar ajuste', disabled: 'disabled', onclick: function () {
      var novo = Number(cont.value), delta = novo - m.f;
      confirmar({ titulo: 'Ajustar o saldo?', texto: m.n + '\nDe ' + m.f + ' para ' + novo + ' ' + m.u + ' (' + (delta > 0 ? '+' : '') + delta + ').\nFica no Histórico em nome de ' + S.admin + ', com o motivo informado.', ok: 'Ajustar' }).then(function (c) {
        if (!c.ok) return;
        salvar.disabled = true; erro.textContent = '';
        chamar('adminAjustar', S.cod, m.id, novo, motivo.value).then(function (r) {
          m.f = r.f; m.d = r.d; S.histSujo = true; aviso('Saldo ajustado para ' + r.f + ' ' + m.u + '.'); desenharEstoque();
        }).catch(function (e) { salvar.disabled = false; erro.textContent = msg(e); });
      });
    } });
    function validarAjuste() { salvar.disabled = !(motivo.value.trim().length >= 3 && cont.value !== '' && Number(cont.value) !== m.f); }
    cont.addEventListener('input', validarAjuste); motivo.addEventListener('input', validarAjuste);
    area.className = 'ajuste';
    area.appendChild(el('div', { cls: 'grade2' },
      el('div', null, el('label', { txt: 'Contagem real no galpão (' + m.u + ')' }), cont),
      el('div', null, el('label', { txt: 'Motivo do ajuste (obrigatório)' }), motivo)));
    area.appendChild(el('div', { cls: 'nota', txt: 'O ajuste fica registrado no Histórico com o seu nome e o motivo.' }));
    area.appendChild(el('div', { cls: 'acoes' }, salvar)); area.appendChild(erro);
    card.appendChild(area);
    return card;
  }
  function formularioNovo(cats) {
    var nome = el('input', { type: 'text', maxlength: '120', 'aria-label': 'Nome do material' });
    var dl = el('datalist', { id: 'lista-cats' }); cats.forEach(function (c) { dl.appendChild(el('option', { value: c })); });
    var cat = el('input', { type: 'text', maxlength: '60', list: 'lista-cats', 'aria-label': 'Categoria' });
    var un = el('select', { 'aria-label': 'Unidade' }); ['un', 'm', 'kg', 'L', 'pct', 'kit', 'rolo', 'par', 'cx'].forEach(function (u) { un.appendChild(el('option', { value: u, txt: u })); });
    var qtd = el('input', { type: 'number', min: '0', step: '1', inputmode: 'numeric', value: '0', 'aria-label': 'Quantidade inicial' });
    var erro = el('div', { cls: 'erro', role: 'alert' });
    var ok = el('button', { cls: 'prim', type: 'button', txt: 'Cadastrar material', onclick: function () {
      ok.disabled = true; erro.textContent = '';
      chamar('adminNovoMaterial', S.cod, nome.value, cat.value, un.value, Number(qtd.value || 0)).then(function (r) {
        S.estSujo = true; aviso('Material cadastrado: ' + r.id + '.'); carregarEstoque();
      }).catch(function (e) { ok.disabled = false; erro.textContent = msg(e); });
    } });
    return el('div', { cls: 'novo' }, dl,
      el('label', { txt: 'Nome do material (padrão: Item Medida Marca)' }), nome,
      el('div', { cls: 'grade2' },
        el('div', null, el('label', { txt: 'Categoria' }), cat),
        el('div', null, el('label', { txt: 'Unidade' }), un),
        el('div', null, el('label', { txt: 'Quantidade inicial no galpão' }), qtd)),
      el('div', { cls: 'acoes' }, ok), erro);
  }
})();
</script>
</body>
</html>
